name: Daily Switchblade Execution

on:
  schedule:
    # 23:23 UTC is 4:23 PM PDT / 7:23 PM EDT
    - cron: '23 23 * * 1-5'
  workflow_dispatch:

jobs:
  run-switchblade:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Python Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # NEW: Rolling Cache for the Parquet Market Data
    - name: Cache Market Data (Parquet)
      uses: actions/cache@v4
      with:
        path: switchblade_data.parquet
        key: parquet-data-${{ github.run_id }}
        restore-keys: |
          parquet-data-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Switchblade Strategy
      run: python switchblade.py

    - name: Commit and Push Updated State
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add state/*.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update portfolio state [skip ci]" && git push)

    - name: Upload HTML Log Artifact
      uses: actions/upload-artifact@v4
      with:
        name: switchblade-daily-log
        path: 'output/*.html'
        retention-days: 5
