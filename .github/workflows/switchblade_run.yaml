name: Switchblade V2.0 Execution Engine

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI
  schedule:
    # Runs at 22:00 UTC (5:00 PM EST / 6:00 PM EDT) Monday-Friday
    - cron: '0 22 * * 1-5'

jobs:
  run-switchblade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Switchblade
        run: python switchblade.py
        
      - name: Upload Logs and State Data
        uses: actions/upload-artifact@v4
        if: always() # Uploads artifacts even if the run fails
        with:
          name: switchblade-outputs
          path: |
            data/*.html
            data/*.json
            data/*.parquet
          retention-days: 7