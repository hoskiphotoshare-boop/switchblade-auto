name: Switchblade V2.0 Execution Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'

permissions:
  contents: write

jobs:
  run-switchblade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Switchblade
        run: python switchblade.py
        
      - name: Commit and Push Output Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest_run.html data/*.json
          git commit -m "Automated Switchblade Execution Update" || echo "No changes to commit"
          git push
