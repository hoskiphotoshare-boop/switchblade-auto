name: Switchblade V3.0 Backtest Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 1-5' # 4:17 PM EDT (Daylight Saving Time)
    - cron: '17 21 * * 1-5' # 4:17 PM EST (Standard Time)

permissions:
  contents: write

jobs:
  run-switchblade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check EDT/EST Schedule Match
        id: tz_check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$(TZ="America/New_York" date +%z)
            if [ "$OFFSET" = "-0400" ] && [ "${{ github.event.schedule }}" != "17 20 * * 1-5" ]; then
              echo "Skipping EST cron (${{ github.event.schedule }}) during EDT (-0400)."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$OFFSET" = "-0500" ] && [ "${{ github.event.schedule }}" != "17 21 * * 1-5" ]; then
              echo "Skipping EDT cron (${{ github.event.schedule }}) during EST (-0500)."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Switchblade
        if: steps.tz_check.outputs.should_run == 'true'
        run: python switchblade.py

      - name: Commit and Push Output Log
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest_run.html docs/*.json data/*.json
          git commit -m "Automated Switchblade Execution Update" || echo "No changes to commit"
          git pull --rebase origin main
          git push
